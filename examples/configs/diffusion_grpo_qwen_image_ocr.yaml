# Diffusion-GRPO exemplar: Qwen-Image LoRA on the Flow-GRPO OCR task.
# Hyperparameters mirror verl-omni examples/flowgrpo_trainer/qwen_image/run_qwen_image_ocr_lora.sh.
# Data: uv run python tools/export_ocr_prompts.py --out-dir examples/data/diffusion/ocr

grpo:
  num_prompts_per_step: 32  # x16 generations = 512 samples/step (verl-omni baseline)
  num_generations_per_prompt: 16
  max_num_steps: 300
  val_period: 30
  val_at_start: true
  seed: 42
  use_leave_one_out_baseline: true
  use_global_std: true  # whole-batch reward std (verl-omni `global_std`); per-group std explodes on near-constant OCR groups
  val_generation:
    num_inference_steps: 40  # deterministic ODE eval (training rollout uses 10)

loss_fn:
  ratio_clip_min: 1.0e-4  # window-mode clip (flow_grpo FAQ: large clip destabilizes Fast mode)
  ratio_clip_max: 1.0e-4
  adv_clip_max: 5.0
  beta: 0.0

checkpointing:
  enabled: true
  checkpoint_dir: "results/diffusion_grpo_qwen_image_ocr"
  save_period: 30

policy:
  model_name: "Qwen/Qwen-Image"
  precision: "bfloat16"
  train_micro_batch_size: 2
  enable_gradient_checkpointing: true
  seed: 42

  optimizer:
    lr: 3.0e-4
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    max_grad_norm: 1.0

  pipeline:
    height: 512
    width: 512
    num_inference_steps: 10  # training rollout steps (val overrides to 40)
    true_cfg_scale: 4.0
    max_sequence_length: 256
    guidance_scale: null

  algo:
    noise_level: 1.2
    sde_type: "sde"
    sde_window_size: 2
    sde_window_range: [0, 5]

  lora_cfg:
    enabled: true
    rank: 64
    alpha: 128
    target_modules: ["to_q", "to_k", "to_v", "add_q_proj", "add_k_proj", "add_v_proj", "to_out.0", "to_add_out", "img_mlp.net.2", "img_mod.1", "txt_mlp.net.2", "txt_mod.1"]
    dropout: 0.0
    exclude_modules: null

data:
  train:
    prompt_file: "examples/data/diffusion/ocr/train_prompts.jsonl"
  val:
    prompt_file: "examples/data/diffusion/ocr/val_prompts.jsonl"

env:
  image_reward:
    plugins:
      - name: "ocr"
        weight: 1.0
    num_cpus_per_worker: 4
    num_gpus_per_worker: 0.0
    num_workers_per_plugin: 16  # 512 images/step on CPU OCR needs parallel replicas

cluster:
  gpus_per_node: 8
  num_nodes: 1

logger:
  log_dir: "logs/diffusion_grpo_qwen_image_ocr"
  wandb_enabled: false
  tensorboard_enabled: true
  tensorboard: {}
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: false
  num_val_samples_to_print: 8
  wandb:
    project: "diffusion-grpo"
    name: "diffusion-grpo-qwen-image-ocr"
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10
